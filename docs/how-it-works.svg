<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" font-family="-apple-system, 'SF Pro Text', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#9aa3ad"/>
    </marker>
  </defs>
  <rect width="960" height="300" rx="16" fill="#fbfbfa"/>

  <!-- Notes app -->
  <g transform="translate(60,70)">
    <rect width="150" height="160" rx="18" fill="#fff" stroke="#e2e2e0" stroke-width="2"/>
    <rect x="0" y="0" width="150" height="34" rx="18" fill="#f8d66d"/>
    <rect x="0" y="18" width="150" height="16" fill="#f8d66d"/>
    <g stroke="#d9d9d6" stroke-width="3" stroke-linecap="round">
      <line x1="22" y1="62" x2="128" y2="62"/>
      <line x1="22" y1="86" x2="110" y2="86"/>
      <line x1="22" y1="110" x2="122" y2="110"/>
      <line x1="22" y1="134" x2="90" y2="134"/>
    </g>
    <text x="75" y="192" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Apple Notes</text>
    <text x="75" y="212" text-anchor="middle" font-size="12" fill="#888">on your Mac (synced from iPhone)</text>
  </g>

  <!-- arrow 1 -->
  <line x1="225" y1="150" x2="315" y2="150" stroke="#9aa3ad" stroke-width="3" marker-end="url(#arr)"/>
  <text x="270" y="135" text-anchor="middle" font-size="13" fill="#666">every hour</text>

  <!-- Markdown files -->
  <g transform="translate(330,70)">
    <g transform="translate(24,14)">
      <rect width="102" height="130" rx="6" fill="#fff" stroke="#e2e2e0" stroke-width="2"/>
    </g>
    <g transform="translate(12,7)">
      <rect width="102" height="130" rx="6" fill="#fff" stroke="#e2e2e0" stroke-width="2"/>
    </g>
    <g>
      <rect width="102" height="130" rx="6" fill="#fff" stroke="#d0d0cd" stroke-width="2"/>
      <text x="12" y="26" font-size="12" font-family="Menlo, monospace" fill="#555">---</text>
      <text x="12" y="42" font-size="12" font-family="Menlo, monospace" fill="#555">folder: Recipes</text>
      <text x="12" y="58" font-size="12" font-family="Menlo, monospace" fill="#555">---</text>
      <text x="12" y="80" font-size="12" font-family="Menlo, monospace" fill="#222"># Chili</text>
      <text x="12" y="98" font-size="12" font-family="Menlo, monospace" fill="#222">- 2 lb beef</text>
      <text x="12" y="114" font-size="12" font-family="Menlo, monospace" fill="#222">- 1 onion</text>
    </g>
    <text x="75" y="192" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Markdown files</text>
    <text x="75" y="212" text-anchor="middle" font-size="12" fill="#888">one per note, plus attachments</text>
  </g>

  <!-- arrow 2 -->
  <line x1="495" y1="150" x2="585" y2="150" stroke="#9aa3ad" stroke-width="3" marker-end="url(#arr)"/>
  <text x="540" y="135" text-anchor="middle" font-size="13" fill="#666">git commit</text>

  <!-- git history -->
  <g transform="translate(600,70)">
    <rect width="300" height="160" rx="12" fill="#fff" stroke="#e2e2e0" stroke-width="2"/>
    <line x1="40" y1="30" x2="40" y2="130" stroke="#d0d0cd" stroke-width="3"/>
    <g fill="#f05033">
      <circle cx="40" cy="36" r="7"/>
      <circle cx="40" cy="68" r="7"/>
      <circle cx="40" cy="100" r="7"/>
      <circle cx="40" cy="132" r="7"/>
    </g>
    <g font-size="13" fill="#444">
      <text x="60" y="41">today 14:00 · 1 note changed</text>
      <text x="60" y="73">yesterday · 3 notes changed</text>
      <text x="60" y="105">last Tuesday · 1 note changed</text>
      <text x="60" y="137" fill="#999">…back to day one</text>
    </g>
    <text x="150" y="192" text-anchor="middle" font-size="15" font-weight="600" fill="#333">Version history</text>
    <text x="150" y="212" text-anchor="middle" font-size="12" fill="#888">see any note as it was, any time — and get it back</text>
  </g>
</svg>
